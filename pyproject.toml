[project]
name = "person-id"
version = "0.1.0"
description = "Person identification module for the AVA robot"
requires-python = ">=3.8"
dependencies = ["numpy", "pyyaml", "opencv-python>=4.8"]  # opencv: default sface backend + camera

[project.optional-dependencies]
camera = ["opencv-python>=4.8"]
realsense = ["pyrealsense2"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["person_id", "person_id.web"]

[tool.setuptools.package-data]
"person_id.web" = ["index.html"]

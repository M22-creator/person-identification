# Which identifier backend to use:
#   sface  - OpenCV YuNet detector + SFace embedding (weights: python -m person_id.download_models)
#   dummy  - detects nobody (for tests / wiring)
identifier: sface

# Where enrolled embeddings are stored (git-ignored).
gallery_path: data/gallery.npz

# Cosine-similarity thresholds for the sface backend.
#   score >= recognize_threshold            -> recognized
#   score <  unknown_threshold              -> unknown
#   in between                              -> uncertain
# Tuned on LFW (6000 pairs, tools/bench_lfw.py; 10-fold accuracy 99.33%):
#   0.40 -> FAR 0.03% / TAR 97.6% per pair (conservative: the gallery match takes
#           the max over all enrolled samples, which raises the real FAR)
#   0.30 -> only 0.8% of same-person pairs score lower
# LFW is web photos; re-check on robot-camera footage before relying on them.
recognize_threshold: 0.40
unknown_threshold: 0.30

# Camera: "realsense", a device index like "0", or a video file path.
source: "0"
width: 640
height: 480
fps: 30

# Output: "stdout" (one JSON per line) or "ros2".
publisher: stdout
ros2_topic: /person_id/result

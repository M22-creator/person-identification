# Which identifier backend to use (the web view can switch between the compared ones):
#   sface       - YuNet detector + OpenCV SFace, 128-D        (python -m person_id.download_models)
#   arcface_mbf - YuNet detector + ArcFace MobileFaceNet, 512-D (... --model arcface_mbf; needs onnxruntime)
#   arcface_r50 - YuNet detector + ArcFace ResNet-50, 512-D     (... --model arcface_r50; needs onnxruntime)
#   insightface - full insightface package, SCRFD detector (thresholds NOT tuned)
#   dummy       - detects nobody (for tests / wiring)
identifier: sface

# Fallback gallery file and thresholds, for backends without an entry under models:.
gallery_path: data/gallery.npz
recognize_threshold: 0.50
unknown_threshold: 0.30

# Per-backend gallery file (git-ignored) and cosine-similarity thresholds.
# Galleries are separate because embeddings of different models cannot be compared.
#   score >= recognize_threshold            -> recognized
#   score <  unknown_threshold              -> unknown
#   in between                              -> uncertain
# All three were set with the same rule on LFW (6000 pairs, tools/bench_models.py):
#   recognize = lowest 0.05 step with LFW FAR <= 0.05% per pair (conservative: a gallery
#               match takes the max over all enrolled samples, which raises the real FAR)
#   unknown   = best-accuracy LFW split, rounded down to a 0.05 step
# LFW is web photos; re-check on robot-camera footage before relying on them.
models:
  sface:
    gallery_path: data/gallery.npz
    recognize_threshold: 0.40   # LFW: TAR 97.6%, FAR 0.03%
    unknown_threshold: 0.30     # LFW: 0.8% of same-person pairs score lower
  arcface_mbf:
    gallery_path: data/gallery_arcface_mbf.npz
    recognize_threshold: 0.30   # LFW on avathor: TAR at FAR 0.1% = 99.4%; 10-fold accuracy 99.55%
    unknown_threshold: 0.20
  arcface_r50:
    gallery_path: data/gallery_arcface_r50.npz
    recognize_threshold: 0.25   # LFW on avathor: TAR at FAR 0.1% = 99.7%; 10-fold accuracy 99.85%
    unknown_threshold: 0.25     # the rule leaves no uncertain band for this model

# Live web view (python -m person_id.web) only: save faces the gallery does not
# know as "person_N" once they have been seen clearly this many times. Use only
# where everyone in view has agreed to be stored. person_id.run never enrolls.
auto_enroll: true
auto_enroll_samples: 10
auto_enroll_min_face_px: 48   # ignore faces smaller than this

# Web view: how people are pictured in its side lists. The live video always shows the camera.
#   avatar    - one of ten original pixel-art animals, chosen from the person_id only
#               (person_1 = fox, person_2 = bee, ...); no face image is cropped or sent
#   pixelate  - 6x6 mosaic of the face crop (may still be recognizable to people who know them)
#   photo     - the face crop itself
thumbnails: avatar

# Web view: interaction history per enrolled person (stored next to the gallery, e.g.
# data/gallery.visits.json). A visit ends once the person has not been recognized for
# this many seconds; coming back later starts a new visit.
visit_gap_s: 10

# Camera: "realsense", a device index like "0", or a video file path.
source: "0"
width: 640
height: 480
fps: 30

# Output: "stdout" (one JSON per line) or "ros2".
publisher: stdout
ros2_topic: /person_id/result
